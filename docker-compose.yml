# =============================================================================
# 42jobs - Docker Compose (BASE, común a dev y prod)
# =============================================================================

services:
  # ─── PostgreSQL ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: 42jobs-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (.NET) ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: 42jobs-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - dpkeys:/app/keys

  # ─── Frontend (Nginx) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: 42jobs-frontend
    networks:
      - internal
    depends_on:
      - backend
    restart: unless-stopped

# ─── Networks ──────────────────────────────────────────────
networks:
  internal:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────
volumes:
  pgdata:
  dpkeys:

# =============================================================================
# 42jobs - Docker Compose Override (DESARROLLO)
# Se carga automáticamente con: docker compose up -d
# Este archivo NO se despliega en producción
# =============================================================================

services:
  # ─── PostgreSQL (dev: puerto expuesto) ───────────────────
  db:
    ports:
      - "5432:5432"

  # ─── Backend (dev: dotnet watch hot-reload) ───────────
  backend:
    build:
      target: development
    volumes:
      - ./backend/src:/app/src
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

  # ─── Frontend (dev: Vite con live-reload / HMR) ───────────
  frontend:
    build:
      target: development
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.js:/app/vite.config.js:ro
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    environment:
      VITE_API_TARGET: http://backend:8080
